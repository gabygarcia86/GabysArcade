<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Coming Soon - Mando's Quest</title>
    <script src="../../assets/js/coming-soon-guard.js"></script>
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#03050c">
    <meta name="description"
      content="Mando's Quest: a 2D platform action-adventure across ten worlds. Protect Baby G, upgrade your arsenal and face Moff Gideon.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="icon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
    <link rel="icon" type="image/png" sizes="114x114"
      href="icon/icon-114.png">
    <link rel="icon" type="image/png" sizes="128x128"
      href="icon/icon-128.png">
    <link rel="icon" type="image/png" sizes="256x256"
      href="icon/icon-256.png">
    <link rel="apple-touch-icon" sizes="256x256" href="icon/icon-256.png">
    <link rel="preload" href="../../assets/fonts/oxanium-latin-wght-normal.woff2"
      as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="app">
      <div id="safe-corner" aria-hidden="true"></div>
      <div id="stage">
        <canvas id="game" aria-label="Mando's Quest game view"></canvas>
      </div>

      <div id="touch" hidden>
        <div class="touch-left">
          <div class="touch-move" data-move-pad>
            <div class="touch-btn" data-action="left" aria-label="Move left"><span>&#9664;</span></div>
            <div class="touch-btn" data-action="right" aria-label="Move right"><span>&#9654;</span></div>
          </div>
          <!-- Outside the pad, so sliding between the arrows can't drop through a ledge. -->
          <div class="touch-btn drop" data-action="down" aria-label="Drop through ledge"><span>&#9660;<small>Drop</small></span></div>
        </div>
        <div class="touch-actions">
          <div class="touch-btn small" data-action="switch"><span>Weapon</span></div>
          <div class="touch-btn small force" data-action="force"><span>Force</span></div>
          <div class="touch-btn fire" data-action="attack"><span>Fire</span></div>
          <div class="touch-btn jump" data-action="jump"><span>Jump<small>hold to fly</small></span></div>
        </div>
      </div>

      <button id="pause" type="button" aria-label="Pause" hidden><i></i><i></i></button>

      <div id="cinematic-controls" hidden>
        <button id="cinematic-skip" class="btn ghost" type="button">Skip</button>
        <button id="cinematic-next" class="btn primary" type="button">Next</button>
      </div>

      <div id="ui" hidden></div>
    </main>
    <noscript>Mando's Quest needs JavaScript to run.</noscript>

    <!-- Plain scripts, not ES modules, so the game also runs from file://. Order matters. -->
    <script src="js/utils.js"></script>
    <script src="js/gameData.js"></script>
    <script src="js/saveManager.js"></script>
    <script src="js/progressionManager.js"></script>
    <script src="js/customization.js"></script>
    <script src="js/audioConfig.js"></script>
    <script src="js/audioManager.js"></script>
    <script src="js/inputManager.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/collisionManager.js"></script>
    <script src="js/particleSystem.js"></script>
    <script src="js/animationManager.js"></script>

    <script src="js/art/weaponArt.js"></script>
    <script src="js/art/characterArt.js"></script>
    <script src="js/art/enemyArt.js"></script>
    <script src="js/art/bossArt.js"></script>
    <script src="js/art/vehicleArt.js"></script>
    <script src="js/art/backgrounds.js"></script>
    <script src="js/art/terrainArt.js"></script>
    <script src="js/art/objectArt.js"></script>

    <script src="js/projectile.js"></script>
    <script src="js/jetpack.js"></script>
    <script src="js/weaponManager.js"></script>
    <script src="js/forceAbility.js"></script>
    <script src="js/player.js"></script>
    <script src="js/babyG.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/collectibleManager.js"></script>
    <script src="js/levelBuilder.js"></script>
    <script src="js/levelManager.js"></script>
    <script src="js/world.js"></script>

    <script src="js/levels/level01.js"></script>
    <script src="js/levels/level02.js"></script>
    <script src="js/levels/level03.js"></script>
    <script src="js/levels/level04.js"></script>
    <script src="js/levels/level05.js"></script>
    <script src="js/levels/level06.js"></script>
    <script src="js/levels/level07.js"></script>
    <script src="js/levels/level08.js"></script>
    <script src="js/levels/level09.js"></script>
    <script src="js/levels/level10.js"></script>

    <script src="js/leaderboard.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/cinematics.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/gameStateManager.js"></script>
    <script src="js/gameEngine.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
