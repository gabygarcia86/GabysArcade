<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Coming Soon - Grinch's Christmas Heist</title>
    <script src="../../assets/js/coming-soon-guard.js"></script>
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#1a2346">
    <meta name="description"
      content="Grinch's Christmas Heist: a silly Christmas arcade game. Sneak around Whoville, steal presents, avoid the Whos and their dogs, and make your getaway before time runs out.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="icon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
    <link rel="icon" type="image/png" sizes="114x114"
      href="icon/icon-114.png">
    <link rel="icon" type="image/png" sizes="128x128"
      href="icon/icon-128.png">
    <link rel="icon" type="image/png" sizes="256x256"
      href="icon/icon-256.png">
    <link rel="apple-touch-icon" sizes="256x256" href="icon/icon-256.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preload" href="../../assets/fonts/oxanium-latin-wght-normal.woff2"
      as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main id="app">
      <div id="safe-corner" aria-hidden="true"></div>
      <div id="stage">
        <canvas id="game" aria-label="Grinch's Christmas Heist game view"></canvas>
        <button id="pause-btn" type="button" aria-label="Pause" hidden><i></i><i></i></button>
      </div>

      <div id="touch" hidden>
        <div class="stick-zone" aria-label="Movement joystick">
          <div class="stick-base"><i class="stick-knob"></i></div>
        </div>
        <div class="action-zone">
          <div class="act-btn sneak-btn" aria-label="Sneak (hold)">
            <span class="act-icon" aria-hidden="true">&#128099;</span>
            <span class="act-label">SNEAK</span>
          </div>
          <div class="act-btn boost-btn" aria-label="Speed boost">
            <span class="act-icon" aria-hidden="true">&#9889;</span>
            <span class="act-label">BOOST</span>
          </div>
        </div>
      </div>

      <div id="ui"></div>
    </main>
    <noscript>Grinch's Christmas Heist needs JavaScript to run.</noscript>

    <!-- Plain scripts, not ES modules, so the game also runs from file://. Order matters. -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/art/characters.js"></script>
    <script src="js/art/world.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/world.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/max.js"></script>
    <script src="js/collectibles.js"></script>
    <script src="js/hazards.js"></script>
    <script src="js/events.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
