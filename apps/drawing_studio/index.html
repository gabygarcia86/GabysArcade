<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ef476f">
    <meta name="description"
      content="Make a colorful picture! Draw, fill, add stickers and shapes, then save your picture. No sign-up, no ads.">
    <link rel="icon" href="icon/icon-16.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16"
      href="icon/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32"
      href="icon/icon-32.png">
    <link rel="icon" type="image/png" sizes="128x128"
      href="icon/icon-128.png">
    <link rel="icon" type="image/png" sizes="256x256"
      href="icon/icon-256.png">
    <link rel="apple-touch-icon" sizes="256x256" href="icon/icon-256.png">
    <title>Gaby's Drawing Studio</title>
    <link rel="preload" href="assets/fonts/fredoka-latin-wght-normal.woff2"
      as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css?v=3">
    <script src="script.js?v=3" defer></script>
  </head>
  <body class="drawing-page">
    <header class="topbar">
      <a class="brand" href="../../apps.html" title="Back to the Apps page"
        aria-label="Back to the Apps page">
        <span class="brand-back" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </span>
        <img src="icon/icon-128.png" alt="" width="40" height="40">
        <span class="brand-text"><b>Gaby's</b> Drawing Studio</span>
      </a>
      <p class="tagline"><span aria-hidden="true">✨</span> Big ideas start
        with little doodles!</p>

      <div class="top-spacer"></div>

      <div class="top-group">
        <button class="top-btn" id="undo-button" type="button"
          aria-label="Undo" title="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
          <span class="top-label">Undo</span>
        </button>
        <button class="top-btn" id="redo-button" type="button"
          aria-label="Redo" title="Redo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
          <span class="top-label">Redo</span>
        </button>
        <button class="top-btn" id="clear-button" type="button"
          title="Start a fresh picture">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6" /><path d="M12 12v6M9 15h6" />
          </svg>
          <span class="top-label">New</span>
        </button>
      </div>

      <button class="save-button" id="save-button" type="button"
        title="Save your picture as an image">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" />
        </svg>
        <span>Save<span class="save-extra"> picture</span></span>
      </button>
    </header>

    <main class="studio" aria-label="Drawing studio">
      <aside class="toolbox" aria-label="Drawing tools">
        <section class="tool-card">
          <h2>Tools</h2>
          <div class="tool-buttons">
            <button class="tool-button is-active" type="button"
              data-tool="pencil" aria-pressed="true" style="--tool: #7b5cf0">
              <span class="tool-icon" aria-hidden="true">✏️</span>
              <span>Draw</span>
            </button>
            <button class="tool-button" type="button" data-tool="fill"
              aria-pressed="false" style="--tool: #3a86ff">
              <span class="tool-icon" aria-hidden="true">🪣</span>
              <span>Fill</span>
            </button>
            <button class="tool-button" type="button" data-tool="eraser"
              aria-pressed="false" style="--tool: #f15bb5">
              <span class="tool-icon" aria-hidden="true">🧽</span>
              <span>Eraser</span>
            </button>
            <button class="tool-button" type="button" data-tool="hand"
              aria-pressed="false" style="--tool: #ff9f1c">
              <span class="tool-icon" aria-hidden="true">✋</span>
              <span>Hand</span>
            </button>
          </div>

          <div class="brush-group">
            <label for="brush-size">Brush size
              <span id="brush-size-value">8</span></label>
            <div class="brush-row">
              <span class="brush-dot is-small" aria-hidden="true"></span>
              <input id="brush-size" type="range" min="2" max="32" value="8">
              <span class="brush-dot is-big" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <section class="tool-card">
          <h2>Colors</h2>
          <div class="color-palette" aria-label="Color palette">
            <button class="color-swatch is-selected" type="button"
              data-color="#27324b" style="--swatch: #27324b"
              aria-label="Dark blue" aria-pressed="true"></button>
            <button class="color-swatch" type="button" data-color="#ff5e73"
              style="--swatch: #ff5e73" aria-label="Pink"
              aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#ffad38"
              style="--swatch: #ffad38" aria-label="Orange"
              aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#f6d64a"
              style="--swatch: #f6d64a" aria-label="Yellow"
              aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#49c985"
              style="--swatch: #49c985" aria-label="Green"
              aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#40a9ed"
              style="--swatch: #40a9ed" aria-label="Blue"
              aria-pressed="false"></button>
            <button class="color-swatch" type="button" data-color="#9b79e8"
              style="--swatch: #9b79e8" aria-label="Purple"
              aria-pressed="false"></button>
            <label class="custom-color" title="Choose another color">
              <span aria-hidden="true">＋</span>
              <input id="custom-color" type="color" value="#27324b"
                aria-label="Choose another color">
            </label>
          </div>
        </section>

        <section class="tool-card sticker-card" data-mode="stamp">
          <h2>Stickers</h2>
          <div class="segmented sticker-modes" role="group"
            aria-label="What stickers do">
            <button class="mode-button" type="button" data-sticker-mode="stamp"
              aria-pressed="false" title="Tap to stamp one sticker">
              <span aria-hidden="true">👆</span> Stamp</button>
            <button class="mode-button" type="button" data-sticker-mode="trail"
              aria-pressed="false" title="Drag to make a trail of stickers">
              <span aria-hidden="true">〰️</span> Trail</button>
            <button class="mode-button" type="button" data-sticker-mode="move"
              aria-pressed="false" title="Pick up stickers to move and change them">
              <span aria-hidden="true">🤏</span> Move</button>
          </div>
          <p class="hint" id="sticker-hint">Tap your picture to stamp a
            sticker!</p>

          <div class="sticker-picker">
            <div class="sticker-tabs" id="sticker-tabs" role="group"
              aria-label="Sticker groups"></div>
            <div class="sticker-list" id="sticker-grid"
              aria-label="Stickers"></div>
          </div>

          <div class="sticker-settings">
            <div class="sticker-preview-box" aria-hidden="true">
              <span class="sticker-preview" id="sticker-preview">⭐</span>
            </div>
            <div class="sticker-sliders">
              <label class="mini-slider">
                <span class="mini-slider-head">Size
                  <output data-value-for="sticker-size">56</output></span>
                <input id="sticker-size" type="range" min="20" max="200"
                  step="2" value="56">
              </label>
              <label class="mini-slider">
                <span class="mini-slider-head">Turn
                  <output data-value-for="sticker-turn">0°</output></span>
                <input id="sticker-turn" type="range" min="-180" max="180"
                  step="5" value="0">
              </label>
              <label class="mini-slider">
                <span class="mini-slider-head">Fade
                  <output data-value-for="sticker-fade">100%</output></span>
                <input id="sticker-fade" type="range" min="15" max="100"
                  step="5" value="100">
              </label>
            </div>
          </div>

          <div class="chip-row">
            <button class="chip" id="sticker-flip" type="button"
              aria-pressed="false" title="Face the other way">
              <span aria-hidden="true">↔️</span> Flip</button>
            <button class="chip new-only" id="sticker-wiggle" type="button"
              aria-pressed="false"
              title="Every sticker gets a slightly different size and turn">
              <span aria-hidden="true">🌀</span> Wiggle</button>
            <button class="chip new-only" id="sticker-mix" type="button"
              aria-pressed="false"
              title="Use a surprise sticker from this group each time">
              <span aria-hidden="true">🎲</span> Mix</button>
          </div>

          <div class="sticker-actions" id="sticker-actions" hidden>
            <button class="chip" id="sticker-copy" type="button"
              title="Make a copy of this sticker">
              <span aria-hidden="true">📄</span> Copy</button>
            <button class="chip" id="sticker-front" type="button"
              title="Put this sticker on top">
              <span aria-hidden="true">⬆️</span> To front</button>
            <button class="chip is-danger" id="sticker-delete" type="button"
              title="Remove this sticker (Delete key)">
              <span aria-hidden="true">🗑️</span> Remove</button>
          </div>
        </section>

        <section class="tool-card">
          <h2>Shapes</h2>
          <div class="shape-style" role="group" aria-label="Shape style">
            <button class="shape-style-button is-selected" type="button"
              data-shape-style="stroke" aria-pressed="true">Outline</button>
            <button class="shape-style-button" type="button"
              data-shape-style="fill" aria-pressed="false">Filled</button>
          </div>
          <p class="hint">Choose a shape, then drag on your picture!</p>
          <div class="shape-list" aria-label="Shapes">
            <button class="shape-button" type="button" data-shape="square"
              aria-label="Square" title="Square" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect x="5" y="5" width="22" height="22" rx="2" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="rectangle"
              aria-label="Rectangle" title="Rectangle" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <rect x="3" y="8" width="26" height="16" rx="2" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="triangle"
              aria-label="Triangle" title="Triangle" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M16 4 29 27H3Z" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="star"
              aria-label="Star" title="Star" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="m16 3 4 9 9 1-7 6 2 10-8-5-8 5 2-10-7-6 9-1Z" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="circle"
              aria-label="Circle" title="Circle" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="16" r="12" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="hexagon"
              aria-label="Hexagon" title="Hexagon" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="m9 4 14 0 7 12-7 12H9L2 16Z" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="octagon"
              aria-label="Octagon" title="Octagon" aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M10 3h12l7 7v12l-7 7H10l-7-7V10Z" />
              </svg>
            </button>
            <button class="shape-button" type="button" data-shape="line"
              aria-label="Straight line" title="Straight line"
              aria-pressed="false">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M4 25 28 7" />
              </svg>
            </button>
          </div>
        </section>
      </aside>

      <section class="stage" aria-label="Your paper">
        <div class="paper-wrap">
          <canvas id="drawing-canvas" aria-label="Drawing canvas"
            role="img">Your browser does not support the drawing
            canvas.</canvas>
        </div>

        <div class="stage-footer">
          <p class="canvas-tip"><span aria-hidden="true">🖍️</span> Use your
            finger, mouse, or a stylus to draw!</p>
          <div class="zoom-controls" role="group" aria-label="Zoom">
            <button class="zoom-button" id="zoom-out-button" type="button"
              aria-label="Zoom out" title="Zoom out">−</button>
            <span class="zoom-value" id="zoom-value"
              aria-live="polite">100%</span>
            <button class="zoom-button" id="zoom-in-button" type="button"
              aria-label="Zoom in" title="Zoom in">+</button>
          </div>
        </div>
      </section>
    </main>

    <div class="notice" id="notice" role="status" aria-live="polite"
      hidden></div>
  </body>
</html>
