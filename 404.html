<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            // GitHub Pages serves this file for a missing URL at any depth, so relative
            // paths need pointing back at the site root (/GabysArcade/ on github.io).
            (function () {
                var folder = location.pathname.split("/")[1];
                var base = document.createElement("base");
                base.href = location.hostname.endsWith(".github.io") && folder ? "/" + folder + "/" : "/";
                document.head.appendChild(base);
            })();
        </script>
        <meta name="robots" content="noindex">
        <meta name="theme-color" content="#070b16">
        <link rel="icon" href="icon/favicon.ico" type="image/x-icon">
        <link rel="icon" type="image/png" sizes="16x16" href="icon/icon-16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="icon/icon-32.png">
        <link rel="icon" type="image/png" sizes="128x128"
            href="icon/icon-128.png">
        <link rel="icon" type="image/png" sizes="256x256"
            href="icon/icon-256.png">
        <link rel="apple-touch-icon" sizes="256x256" href="icon/icon-256.png">
        <title>Page Not Found - 404</title>
        <link rel="stylesheet" href="assets/css/site.css">
        <link rel="stylesheet" href="404.css">
        <script src="assets/js/layout.js" defer></script>
    </head>
    <body class="not-found-page" data-page="not-found">
        <header class="site-header" id="site-header"></header>
        <div id="poop-layer" aria-hidden="true"></div>
        <main id="main" tabindex="-1">
            <div class="not-found">
                <h1 class="brand-accent">404</h1>
                <h2>AH AH AH</h2>
                <img src="404.png" alt="404" class="not-found-image">
                <p>You didn't say the magic word.</p>
                <a href="index.html" class="btn btn-primary">Back Home</a>
            </div>
        </main>
        <footer class="site-footer" id="site-footer"></footer>
        <script src="404.js"></script>
        <script>
            const poopStorm = new PoopStorm(document.getElementById("poop-layer"));
            const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (!calm) poopStorm.start();
            window.addEventListener("pagehide", () => poopStorm.stop());
            window.addEventListener("pageshow", (event) => {
                if (event.persisted && !calm) poopStorm.start();
            });
        </script>
    </body>
</html>
